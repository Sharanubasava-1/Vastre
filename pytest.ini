[pytest]
testpaths = backend
markers =
    google_auth: Google token verification, account creation/linking and Google privilege safety
    rate_limits: Authentication throttling, lockout and development reset
    csrf: Origin/custom-header enforcement on state-changing endpoints
    sessions: Session ownership, revocation, password hardening and disabled/expired credentials
    rbac: Role permissions, admin guard rails and order ownership
    migration: Original-schema migration/idempotence and legacy account compatibility
    other: Configuration, catalogue/payment compatibility, email, profile and test isolation
